name: Build Refactor Windows

on:
  push:
    branches:
      - refactor/clean-v1.1.0
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies including yt-dlp prereleases
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre -r requirements.txt

      - name: Download FFmpeg and FFplay
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          7z e ffmpeg.zip ffmpeg.exe ffplay.exe -r -y

      - name: Build executable
        shell: cmd
        run: build.bat

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-v1.1.0-Windows
          path: dist/YouTubeDownloader_v1.1.0.exe
          if-no-files-found: error
